        - { payer-name: "Papelaria Central ME", amount: 392.15, due-in-days: 33 }
        - { payer-name: "Oficina Mecânica Avenida ME", amount: 1580.75, due-in-days: 38 }
        - { payer-name: "Construtora Horizonte SA", amount: 9870.00, due-in-days: 45 }
        - { payer-name: "Restaurante Sabor Caseiro LTDA", amount: 2214.60, due-in-days: 52 }
