server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  shutdown: graceful

spring:
  application:
    name: wpp-receivables-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${postgres.host}/${postgres.database}
    username: ${postgres.username}
    password: ${postgres.password}
    hikari:
      connection-timeout: 1000
      maximum-pool-size: 20
      pool-name: master
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    ROOT: INFO
    com.tubadev: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# --- WhatsApp Cloud API ---------------------------------------------------------------------------
whatsapp:
  adapter: ${WHATSAPP_ADAPTER:cloud-api}          # cloud-api | mock
  base-url: https://graph.facebook.com
  api-version: ${WHATSAPP_API_VERSION:v23.0}
  phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
  access-token: ${WHATSAPP_ACCESS_TOKEN:}
  app-secret: ${WHATSAPP_APP_SECRET:}
  verify-token: ${WHATSAPP_VERIFY_TOKEN:}
  allowed-country-codes: ${WHATSAPP_ALLOWED_COUNTRY_CODES:}   # comma separated calling codes, empty = any
  connect-timeout: 2s
  read-timeout: 10s

campaign:
  dispatch-concurrency: 20

# --- Session lifecycle -----------------------------------------------------------------------------
journey:
  session-timeout: ${JOURNEY_SESSION_TIMEOUT:30m}   # no customer message → the next one starts a new session (= mock.offer-ttl)
  handoff-timeout: ${JOURNEY_HANDOFF_TIMEOUT:2h}    # no agent message → the customer goes back to the bot

outbox:
  relay:
    enabled: true
    fixed-delay: 2s
    batch-size: 50
    max-attempts: 5

security:
  api-key: ${API_KEY:}

# --- External services (ports) --------------------------------------------------------------------
# Customer, eligibility and anticipation belong to other services. Until their APIs exist, the mock
# adapters below implement the ports (CustomerGateway, EligibilityGateway, AnticipationGateway).
receivables:
  adapter: mock

biometrics:
  adapter: mock               # identity validation provider (face match / liveness)

# --- Contract document ----------------------------------------------------------------------------
contract:
  assignee-name: ${CONTRACT_ASSIGNEE_NAME:Cessionária Exemplo S.A.}
  assignee-document: ${CONTRACT_ASSIGNEE_DOCUMENT:00000000000000}
  assignee-address: ${CONTRACT_ASSIGNEE_ADDRESS:Endereço da cessionária (configure CONTRACT_ASSIGNEE_ADDRESS)}
  city: ${CONTRACT_CITY:São Paulo}
  # printed as a banner and watermark; keep it while biometrics/anticipation are mocked
  disclaimer: ${CONTRACT_DISCLAIMER:Ambiente de desenvolvimento – validação biométrica simulada – documento sem validade jurídica}

mock:
  anticipation:
    monthly-rate: 0.0199      # 1.99% a.m.
    minimum-amount: 500.00
    offer-ttl: 30m
  biometrics:
    min-image-bytes: 10240    # smaller selfies are rejected as low_quality
    fail-first-attempts: ${MOCK_BIOMETRICS_FAIL_FIRST:0}   # >0 rejects the first selfies as face_mismatch
    approval-score: 0.97
  customers:
    - id: cus_sandbox_01
      name: ${MOCK_CUSTOMER_NAME:Cliente Sandbox}
      document: "11222333000181"
      document-type: cnpj
      phone-number: ${MOCK_CUSTOMER_PHONE:15555550101}   # put your WhatsApp test number here (E.164 digits)
      opted-in: true
      # Sample portfolio: offers are always combinations of these boletos, never boletos shaped to the request.
      receivables:
        - { payer-name: "Farmácia Vida LTDA", amount: 487.90, due-in-days: 9 }
        - { payer-name: "Auto Peças Rodovia ME", amount: 1236.45, due-in-days: 14 }
        - { payer-name: "Distribuidora Sol SA", amount: 2750.00, due-in-days: 16 }
