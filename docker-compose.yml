services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: receivables
      POSTGRES_USER: receivables
      POSTGRES_PASSWORD: receivables
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U receivables"]
      interval: 5s
      retries: 10
